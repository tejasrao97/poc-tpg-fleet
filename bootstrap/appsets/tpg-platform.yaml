apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tpg-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            tpg.fleet/managed: "true"
  template:
    metadata:
      name: "tpg-{{.name}}-platform"
      labels:
        tpg.fleet/cluster: "{{.name}}"
        tpg.fleet/wave: '{{index .metadata.labels "tpg.fleet/wave"}}'
        tpg.fleet/component: platform
    spec:
      project: tpg
      source:
        repoURL: https://github.com/<org>/tpg-fleet.git
        targetRevision: main
        path: platform/base
      destination:
        server: "{{.server}}"
        namespace: default
      syncPolicy:
        syncOptions:
          - ServerSideApply=true
