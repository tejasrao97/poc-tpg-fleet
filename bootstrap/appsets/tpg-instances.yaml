# One Application per Postgres instance: tpg-<cluster>-<instance>.
#
# Generator: registered clusters (label tpg.fleet/managed=true) x clusters/fleet.yaml,
# then one element per clusters.<cluster>.instances.<instance> entry. A cluster
# without an entry in fleet.yaml gets no instance Applications.
#
# Helm values, lowest to highest precedence:
#   charts/tpg-instance/values.yaml      chart defaults
#   clusters/_template/cluster.yaml      cluster defaults for every cluster
#   clusters/_template/instance.yaml     instance defaults for every instance
#   values (below)                       cluster.name, pg-backups-<cluster>, and the
#                                        cluster and instance overrides from fleet.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tpg-instances
  namespace: argocd
spec:
  # Removing an instance from fleet.yaml (tpg-delete-instance, tpg-delete-apps)
  # deletes the Application only; the database objects stay until the workflow
  # removes them explicitly.
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        tpg.fleet/managed: "true"
                - git:
                    repoURL: https://github.com/<org>/tpg-fleet.git
                    revision: main
                    files:
                      - path: clusters/fleet.yaml
          - list:
              # [{"instance": {"name": "<instance>", "values": {...}}}, ...] for this cluster
              elementsYaml: >-
                {{- $items := list -}}
                {{- range $name, $values := (dig "clusters" .name "instances" (dict) .) -}}
                {{- $items = append $items (dict "instance" (dict "name" $name "values" (default (dict) $values))) -}}
                {{- end -}}
                {{- toJson $items -}}
  template:
    metadata:
      name: "tpg-{{.name}}-{{.instance.name}}"
      labels:
        tpg.fleet/cluster: "{{.name}}"
        tpg.fleet/wave: '{{index .metadata.labels "tpg.fleet/wave"}}'
        tpg.fleet/component: instance
        tpg.fleet/instance: "{{.instance.name}}"
    spec:
      project: tpg
      source:
        repoURL: https://github.com/<org>/tpg-fleet.git
        targetRevision: main
        path: charts/tpg-instance
        helm:
          valueFiles:
            - ../../clusters/_template/cluster.yaml
            - ../../clusters/_template/instance.yaml
          values: >-
            {{- $cluster := dig "clusters" .name (dict) . -}}
            {{- $base := dict "cluster" (dict "name" .name) "backup" (dict "container" (printf "pg-backups-%s" .name)) -}}
            {{- $clusterOverrides := deepCopy (omit $cluster "instances" "operator") -}}
            {{- $instance := deepCopy .instance.values -}}
            {{- $_ := set $instance "instance" (mergeOverwrite (dig "instance" (dict) $instance) (dict "name" .instance.name)) -}}
            {{- toJson (mergeOverwrite $base $clusterOverrides $instance) -}}
      destination:
        server: "{{.server}}"
        namespace: "pg-{{.instance.name}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
