apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tpg-hub-monitoring
  namespace: argocd
spec:
  project: tpg
  source:
    repoURL: https://github.com/<org>/tpg-fleet.git
    targetRevision: main
    path: monitoring/azure/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
