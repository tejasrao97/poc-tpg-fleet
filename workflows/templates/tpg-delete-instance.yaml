# Day 2: guarded delete of one Postgres instance on one cluster. Takes a final
# backup, removes the instance from clusters/fleet.yaml, removes the Application without
# cascading, deletes the Postgres objects, and keeps volumes, namespace and the
# backup repository unless purge options are set.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-delete-instance
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 2: guarded delete of one Postgres instance. Final backup, fleet.yaml removal, non-cascading Application removal, CR delete; PVCs and namespace kept unless purged. The backup repository is never deleted.
spec:
  serviceAccountName: tpg-workflow
  entrypoint: main
  onExit: exit-handler
  synchronization:
    mutexes:
      - name: "tpg-instance-{{workflow.parameters.cluster}}-{{workflow.parameters.instance}}"
  arguments:
    parameters:
    # ---- mandatory (no default; the validate step lists the valid choices)
    - name: cluster
      description: "One registered cluster"
      value: ""
    - name: instance
      description: "Postgres instance declared for that cluster in clusters/fleet.yaml"
      value: ""
    - name: confirm
      description: "Type the instance name to confirm"
      value: ""
    - name: finalBackup
      value: "true"
      enum: ["true", "false", "required"]
    - name: purgePvcs
      description: "Delete PVCs and their Azure disks (irreversible)"
      value: "false"
      enum: ["false", "true"]
    - name: purgeNamespace
      description: "Delete the pg-<instance> namespace (needs purgePvcs=true)"
      value: "false"
      enum: ["false", "true"]
    - name: pushMode
      description: "direct: push to the fleet branch; pr: open a pull request and continue after it is merged"
      value: "direct"
      enum: ["direct", "pr"]
    - name: timeoutSeconds
      value: "1800"
    - name: prTimeoutSeconds
      value: "3600"
    - name: toolsImage
      value: alpine/k8s:1.35.8
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: validate
        template: validate
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: delete
        template: delete
  - name: validate
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/validate-params.sh, delete-instance]
      env:
        - {name: P_CLUSTER, value: "{{workflow.parameters.cluster}}"}
        - {name: P_INSTANCE, value: "{{workflow.parameters.instance}}"}
        - {name: P_PUSH_MODE, value: "{{workflow.parameters.pushMode}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: delete
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_delete_result
          help: "Instance delete result"
          labels:
            - key: cluster
              value: "{{workflow.parameters.cluster}}"
            - key: instance_name
              value: "{{workflow.parameters.instance}}"
            - key: purge_pvcs
              value: "{{workflow.parameters.purgePvcs}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/delete-instance.sh]
      args:
        - "{{workflow.name}}"
        - "{{workflow.parameters.cluster}}"
        - "{{workflow.parameters.instance}}"
        - "{{workflow.parameters.confirm}}"
        - "{{workflow.parameters.finalBackup}}"
        - "{{workflow.parameters.purgePvcs}}"
        - "{{workflow.parameters.purgeNamespace}}"
        - "{{workflow.parameters.timeoutSeconds}}"
      env:
        - {name: PUSH_MODE, value: "{{workflow.parameters.pushMode}}"}
        - {name: PR_TIMEOUT_SECONDS, value: "{{workflow.parameters.prTimeoutSeconds}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: steps
