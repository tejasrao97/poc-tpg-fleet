# Day 1: upgrade the Tanzu Postgres operator (component=operator) or Postgres instances
# (component=postgres) on the selected clusters, canary first and then in batches.
# The new version is written to clusters/fleet.yaml (pushMode direct or pr).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-upgrade
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 1: upgrade the Tanzu Postgres operator or Postgres instances, canary first and then in
      batches. Writes the version to clusters/fleet.yaml. Major Postgres upgrades need
      allowMajor=true and pause for approval before every batch after the canary.
spec:
  serviceAccountName: tpg-workflow
  entrypoint: main
  onExit: exit-handler
  parallelism: 20
  arguments:
    parameters:
    # ---- mandatory (no default; the validate step lists the valid choices)
    - name: component
      description: "operator: Tanzu Postgres operator; postgres: Postgres instances"
      value: ""
      enum: ["", "operator", "postgres"]
    - name: targetVersion
      description: "operator: chart version such as v4.5.0; postgres: PostgresVersion such as postgres-17.6"
      value: ""
    - name: clusters
      description: "Comma-separated registered clusters, or all"
      value: ""
    - name: pushMode
      description: "direct: push to the fleet branch; pr: open a pull request and continue after it is merged"
      value: ""
      enum: ["", "direct", "pr"]
    - name: instances
      description: "component=postgres only (mandatory there): comma-separated instances, or all"
      value: ""
    # ---- optional
    - name: preUpgradeBackup
      description: "Full backup of each affected instance before the upgrade"
      value: "true"
      enum: ["true", "false"]
    - name: allowMajor
      description: "component=postgres: allow major version upgrades (for example 16 to 17)"
      value: "false"
      enum: ["false", "true"]
    - name: maxParallel
      value: "1"
    - name: dryRun
      description: "true: validate and record the planned upgrade per target; change nothing"
      value: "false"
      enum: ["false", "true"]
    - name: timeoutSeconds
      description: "Per-cluster (operator) or per-instance (postgres) timeout"
      value: "1800"
    - name: prTimeoutSeconds
      value: "3600"
    - name: toolsImage
      value: alpine/k8s:1.35.8
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: validate
        template: validate
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: discover
        templateRef:
          name: tpg-lib
          template: discover
        arguments:
          parameters:
            - name: clusters
              value: "{{workflow.parameters.clusters}}"
    - - name: plan
        templateRef:
          name: tpg-lib
          template: plan-batches
        arguments:
          parameters:
            - name: requirePrecheck
              value: "false"
            - name: maxParallel
              value: "{{workflow.parameters.maxParallel}}"
    - - name: upgrade
        template: run-batches
        when: "{{steps.plan.outputs.parameters.hasBatches}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.plan.outputs.parameters.batches}}"
  - name: run-batches
    inputs:
      parameters:
        - name: batches
    steps:
    - - name: split
        templateRef:
          name: tpg-lib
          template: split-first
        arguments:
          parameters:
            - name: batches
              value: "{{inputs.parameters.batches}}"
    - - name: batch
        template: upgrade-cluster
        arguments:
          parameters:
            - name: cluster
              value: "{{item}}"
        withParam: "{{steps.split.outputs.parameters.first}}"
    - - name: approve-next-batch
        templateRef:
          name: tpg-lib
          template: approve
        when: "'{{workflow.parameters.component}}' == 'postgres' && '{{workflow.parameters.allowMajor}}' == 'true' && '{{workflow.parameters.dryRun}}' == 'false' && {{steps.split.outputs.parameters.hasRest}} == true"
    - - name: next
        template: run-batches
        when: "{{steps.split.outputs.parameters.hasRest}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.split.outputs.parameters.rest}}"
  - name: validate
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/validate-params.sh, upgrade]
      env:
        - {name: P_COMPONENT, value: "{{workflow.parameters.component}}"}
        - {name: P_TARGET_VERSION, value: "{{workflow.parameters.targetVersion}}"}
        - {name: P_CLUSTERS, value: "{{workflow.parameters.clusters}}"}
        - {name: P_PUSH_MODE, value: "{{workflow.parameters.pushMode}}"}
        - {name: P_INSTANCES, value: "{{workflow.parameters.instances}}"}
        - {name: P_PRE_BACKUP, value: "{{workflow.parameters.preUpgradeBackup}}"}
        - {name: P_ALLOW_MAJOR, value: "{{workflow.parameters.allowMajor}}"}
        - {name: P_MAX_PARALLEL, value: "{{workflow.parameters.maxParallel}}"}
        - {name: P_DRY_RUN, value: "{{workflow.parameters.dryRun}}"}
        - {name: P_TIMEOUT, value: "{{workflow.parameters.timeoutSeconds}}"}
        - {name: P_PR_TIMEOUT, value: "{{workflow.parameters.prTimeoutSeconds}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: upgrade-cluster
    inputs:
      parameters:
        - name: cluster
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_upgrade_result
          help: "Upgrade result per cluster (last recorded result on that cluster)"
          labels:
            - key: cluster
              value: "{{inputs.parameters.cluster}}"
            - key: component
              value: "{{workflow.parameters.component}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, -c]
      args:
        - |
          if [ "$P_COMPONENT" = operator ]; then
            exec bash /scripts/operator-upgrade.sh "$WF" "$CLUSTER" "$P_TARGET_VERSION" "$P_TIMEOUT"
          fi
          exec bash /scripts/postgres-upgrade.sh "$WF" "$CLUSTER" "$P_TARGET_VERSION" "$P_INSTANCES" "$P_TIMEOUT"
      env:
        - {name: WF, value: "{{workflow.name}}"}
        - {name: CLUSTER, value: "{{inputs.parameters.cluster}}"}
        - {name: P_COMPONENT, value: "{{workflow.parameters.component}}"}
        - {name: P_TARGET_VERSION, value: "{{workflow.parameters.targetVersion}}"}
        - {name: P_PUSH_MODE, value: "{{workflow.parameters.pushMode}}"}
        - {name: P_INSTANCES, value: "{{workflow.parameters.instances}}"}
        - {name: P_PRE_BACKUP, value: "{{workflow.parameters.preUpgradeBackup}}"}
        - {name: P_ALLOW_MAJOR, value: "{{workflow.parameters.allowMajor}}"}
        - {name: P_DRY_RUN, value: "{{workflow.parameters.dryRun}}"}
        - {name: P_TIMEOUT, value: "{{workflow.parameters.timeoutSeconds}}"}
        - {name: P_PR_TIMEOUT, value: "{{workflow.parameters.prTimeoutSeconds}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: "upgrade:{{workflow.parameters.component}}"
