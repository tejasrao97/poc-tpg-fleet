# Day 1: rotate one credential (broadcom-registry, backup-storage or git-push) everywhere it is used, reading the new value from its hub source Secret.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-rotate-credential
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 1: rotate one credential (broadcom-registry, backup-storage or git-push) everywhere it is used, reading the new value from its hub source Secret.
spec:
  serviceAccountName: tpg-workflow
  entrypoint: main
  onExit: exit-handler
  parallelism: 20
  arguments:
    parameters:
    - name: secretType
      value: "broadcom-registry"
    - name: clusters
      value: "all"
    - name: maxParallel
      value: "5"
    - name: toolsImage
      value: alpine/k8s:1.35.8
    - name: azCliImage
      value: mcr.microsoft.com/azure-cli:2.90.0
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: hub
        template: rotate-hub
        when: "'{{workflow.parameters.secretType}}' != 'backup-storage'"
    - - name: discover
        templateRef:
          name: tpg-lib
          template: discover
        when: "'{{workflow.parameters.secretType}}' != 'git-push'"
        arguments:
          parameters:
            - name: clusters
              value: "{{workflow.parameters.clusters}}"
    - - name: plan
        templateRef:
          name: tpg-lib
          template: plan-batches
        when: "'{{workflow.parameters.secretType}}' != 'git-push'"
        arguments:
          parameters:
            - name: requirePrecheck
              value: "false"
            - name: maxParallel
              value: "{{workflow.parameters.maxParallel}}"
    - - name: rotate
        template: run-batches
        when: "'{{workflow.parameters.secretType}}' != 'git-push' && {{steps.plan.outputs.parameters.hasBatches}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.plan.outputs.parameters.batches}}"
  - name: run-batches
    inputs:
      parameters:
        - name: batches
    steps:
    - - name: split
        templateRef:
          name: tpg-lib
          template: split-first
        arguments:
          parameters:
            - name: batches
              value: "{{inputs.parameters.batches}}"
    - - name: batch
        template: rotate-one
        arguments:
          parameters:
            - name: cluster
              value: "{{item}}"
        withParam: "{{steps.split.outputs.parameters.first}}"
    - - name: next
        template: run-batches
        when: "{{steps.split.outputs.parameters.hasRest}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.split.outputs.parameters.rest}}"
  - name: rotate-hub
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/rotate-hub.sh]
      args:
        - "{{workflow.name}}"
        - "{{workflow.parameters.secretType}}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: rotate-one
    inputs:
      parameters:
        - name: cluster
    steps:
    - - name: verify-storage-key
        template: verify-storage-key
        when: "'{{workflow.parameters.secretType}}' == 'backup-storage'"
        arguments:
          parameters:
            - name: cluster
              value: "{{inputs.parameters.cluster}}"
    - - name: rotate
        template: rotate-cluster
        arguments:
          parameters:
            - name: cluster
              value: "{{inputs.parameters.cluster}}"
  - name: verify-storage-key
    inputs:
      parameters:
        - name: cluster
    container:
      image: "{{workflow.parameters.azCliImage}}"
      command: [bash, /scripts/verify-storage-key.sh]
      args:
        - "pg-backups-{{inputs.parameters.cluster}}"
      env:
        - name: ACCOUNT_NAME
          valueFrom:
            secretKeyRef:
              name: tpg-src-backup-storage
              key: accountName
        - name: ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              name: tpg-src-backup-storage
              key: accountKey
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: rotate-cluster
    inputs:
      parameters:
        - name: cluster
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_rotation_result
          help: "Credential rotation result per cluster"
          labels:
            - key: cluster
              value: "{{inputs.parameters.cluster}}"
            - key: secret_type
              value: "{{workflow.parameters.secretType}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/rotate-cluster.sh]
      args:
        - "{{workflow.name}}"
        - "{{inputs.parameters.cluster}}"
        - "{{workflow.parameters.secretType}}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: cluster
