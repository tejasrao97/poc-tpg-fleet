# Day 1: guarded backup of every Postgres instance on the selected clusters. Skips an instance whose previous backup is still running after a 2-minute wait.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-backup
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 1: guarded backup of every Postgres instance on the selected clusters. Skips an instance whose previous backup is still running after a 2-minute wait.
spec:
  serviceAccountName: tpg-workflow
  entrypoint: main
  onExit: exit-handler
  parallelism: 10
  arguments:
    parameters:
    - name: backupType
      value: "full"
    - name: clusters
      value: "all"
    - name: backupTimeoutSeconds
      value: "10800"
    - name: scheduledOnly
      description: "true (CronWorkflows): skip instances with backup.scheduled false in clusters/fleet.yaml"
      value: "false"
      enum: ["false", "true"]
    - name: toolsImage
      value: alpine/k8s:1.35.8
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: discover
        templateRef:
          name: tpg-lib
          template: discover
        arguments:
          parameters:
            - name: clusters
              value: "{{workflow.parameters.clusters}}"
    - - name: backup
        template: backup-instance
        arguments:
          parameters:
            - name: cluster
              value: "{{item.cluster}}"
            - name: instance
              value: "{{item.instance}}"
            - name: scheduled
              value: "{{item.scheduled}}"
        withParam: "{{steps.discover.outputs.parameters.instanceItems}}"
  - name: backup-instance
    inputs:
      parameters:
        - name: cluster
        - name: instance
        - name: scheduled
          value: "true"
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_backup_result
          help: "Backup result per instance"
          labels:
            - key: cluster
              value: "{{inputs.parameters.cluster}}"
            - key: instance_name
              value: "{{inputs.parameters.instance}}"
            - key: backup_type
              value: "{{workflow.parameters.backupType}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/backup-instance.sh]
      args:
        - "{{workflow.name}}"
        - "{{inputs.parameters.cluster}}"
        - "{{inputs.parameters.instance}}"
        - "{{workflow.parameters.backupType}}"
        - "{{workflow.parameters.backupTimeoutSeconds}}"
        - "{{inputs.parameters.scheduled}}"
        - "{{workflow.parameters.scheduledOnly}}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: instance
