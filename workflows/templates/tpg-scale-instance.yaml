# Day 1: scale the read replicas of one Postgres instance on one cluster. The new count is
# written to clusters/fleet.yaml (pushMode direct or pr), synced, and verified.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-scale-instance
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 1: scale the read replicas of one Postgres instance on one cluster. The new count is
      written to clusters/fleet.yaml, synced, and verified.
spec:
  serviceAccountName: tpg-workflow
  entrypoint: main
  onExit: exit-handler
  synchronization:
    mutexes:
      - name: "tpg-instance-{{workflow.parameters.cluster}}-{{workflow.parameters.instance}}"
  arguments:
    parameters:
    # ---- mandatory (no default; the validate step lists the valid choices)
    - name: cluster
      description: "One registered cluster"
      value: ""
    - name: instance
      description: "Postgres instance declared for that cluster in clusters/fleet.yaml"
      value: ""
    - name: replicas
      description: "Read replicas (0 to maxReadReplicas, default maximum 3)"
      value: ""
    - name: pushMode
      description: "direct: push to the fleet branch; pr: open a pull request and continue after it is merged"
      value: ""
      enum: ["", "direct", "pr"]
    # ---- optional
    - name: enableHAIfNeeded
      description: "replicas > 0 on an instance without high availability: turn it on (true) or fail (false)"
      value: "true"
      enum: ["true", "false"]
    - name: dryRun
      value: "false"
      enum: ["false", "true"]
    - name: timeoutSeconds
      value: "900"
    - name: prTimeoutSeconds
      value: "3600"
    - name: toolsImage
      value: alpine/k8s:1.35.8
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: validate
        template: validate
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: scale
        template: scale
  - name: validate
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/validate-params.sh, scale]
      env:
        - {name: P_CLUSTER, value: "{{workflow.parameters.cluster}}"}
        - {name: P_INSTANCE, value: "{{workflow.parameters.instance}}"}
        - {name: P_REPLICAS, value: "{{workflow.parameters.replicas}}"}
        - {name: P_PUSH_MODE, value: "{{workflow.parameters.pushMode}}"}
        - {name: P_ENABLE_HA, value: "{{workflow.parameters.enableHAIfNeeded}}"}
        - {name: P_DRY_RUN, value: "{{workflow.parameters.dryRun}}"}
        - {name: P_TIMEOUT, value: "{{workflow.parameters.timeoutSeconds}}"}
        - {name: P_PR_TIMEOUT, value: "{{workflow.parameters.prTimeoutSeconds}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: scale
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_scale_result
          help: "Scaling result per instance"
          labels:
            - key: cluster
              value: "{{workflow.parameters.cluster}}"
            - key: instance_name
              value: "{{workflow.parameters.instance}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/scale-instance.sh]
      args:
        - "{{workflow.name}}"
        - "{{workflow.parameters.cluster}}"
        - "{{workflow.parameters.instance}}"
        - "{{workflow.parameters.replicas}}"
        - "{{workflow.parameters.timeoutSeconds}}"
      env:
        - {name: P_PUSH_MODE, value: "{{workflow.parameters.pushMode}}"}
        - {name: P_ENABLE_HA, value: "{{workflow.parameters.enableHAIfNeeded}}"}
        - {name: P_DRY_RUN, value: "{{workflow.parameters.dryRun}}"}
        - {name: P_PR_TIMEOUT, value: "{{workflow.parameters.prTimeoutSeconds}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: steps
