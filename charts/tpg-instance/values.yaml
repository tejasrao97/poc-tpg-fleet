# Chart defaults. The tpg-instances ApplicationSet adds clusters/_template/cluster.yaml,
# clusters/_template/instance.yaml and the clusters/fleet.yaml overrides on top.
cluster:
  # Set by the tpg-instances ApplicationSet (informational)
  name: ""

instance:
  name: ""
  postgresVersion: ""
  storageClassName: tpg-premium-retain
  storageSize: 20Gi
  walStorageSize: 10Gi
  serviceType: ClusterIP
  highAvailability:
    enabled: true
    readReplicas: 1
  resources:
    data:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

backup:
  container: ""
  endpoint: blob.core.windows.net
  fullRetention: 4
  diffRetention: 6
